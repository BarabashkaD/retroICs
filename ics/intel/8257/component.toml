[component]
name = "intel/8257"
kind = "ic"
title = "Intel 8257 programmable DMA controller"
reproduces = "i8257"
fidelity = "datasheet"
interface = 1
record_prefix = "DMA"

[[equivalent]]
part = "КР580ВТ57"
translit = "kr580vt57"
level = "unverified"

[rtl]
top = "intel_8257"
files = ["rtl/intel_8257.v"]
iverilog_flags = ["-g2005"]

[[test]]
name = "vt57"
tier = "quick"
top = "tb_vt57"
files = ["tb/tb_vt57.v"]

[[test]]
name = "vt57_func"
tier = "quick"
top = "tb_vt57_func"
files = ["tb/tb_vt57_func.v"]
ids = [
    "DMA-1",
    "DMA-2",
    "DMA-3",
    "DMA-4",
    "DMA-5",
    "DMA-7",
    "DMA-8",
    "DMA-9",
    "DMA-11",
    "DMA-12",
    "DMA-13",
    "DMA-14",
    "DMA-15",
    "DMA-16",
    "DMA-20",
    "DMA-22",
    "DMA-26",
]

# match anywhere: the extra state delays S4, so MEMW and HRQ (theta rise of S4, rel 31) are
# late before DACK (theta fall of S4, rel 36); 'memw at 31' is vt57_memw_end_late's own text
[[negative]]
test = "vt57"
fault = "faults/vt57_extra_state.patch"
expect = "ERROR: vt57: dack at 36"
match = "anywhere"

# match anywhere: S4 to S1 without DRQ keeps HRQ high at the theta rise of S4 (rel 31, the
# HRQ check) before the early S1 shows in the period check
[[negative]]
test = "vt57"
fault = "faults/vt57_s4_to_s1.patch"
expect = "ERROR: vt57: period 36"
match = "anywhere"

